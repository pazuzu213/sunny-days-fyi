<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Days Apps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
    .tagline { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #666; margin-bottom: 48px; }
    .apps { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 640px; }
    .app-card { background: #141418; border: 1px solid #222; border-radius: 20px; padding: 28px 24px; width: 180px; text-align: center; text-decoration: none; transition: border-color 0.2s, transform 0.2s; }
    .app-card:hover { border-color: #444; transform: translateY(-2px); }
    .app-icon { font-size: 40px; margin-bottom: 12px; }
    .app-name { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .app-desc { font-size: 12px; color: #666; line-height: 1.5; }
    footer { margin-top: 64px; font-size: 12px; color: #444; }
    footer a { color: #666; text-decoration: none; }
    footer a:hover { color: #aaa; }
  </style>
</head>
<body>
  <p class="tagline">Apps by Sunny Dulay</p>
  <div class="apps">
    <a class="app-card" href="/brewscan">
      <div class="app-icon">☕</div>
      <div class="app-name">BrewScan</div>
      <div class="app-desc">Point. Scan. Brew. AI-powered Nespresso pod identifier.</div>
    </a>
    <a class="app-card" href="/pawdiac">
      <div class="app-icon">🐾</div>
      <div class="app-name">Pawdiac</div>
      <div class="app-desc">Dog astrology & cosmic intelligence for your pup.</div>
    </a>
    <a class="app-card" href="/lore">
      <div class="app-icon">🎵</div>
      <div class="app-name">Lore</div>
      <div class="app-desc">The meaning behind every song.</div>
    </a>
  </div>
  <footer>
    <a href="mailto:support@sunny-days.fyi">support@sunny-days.fyi</a>
  </footer>
</body>
</html>
